on:
    push:
        branches:
            - main
            - "release/**"
        paths:
            - "src/**"
    pull_requests:
        branches:
            - main
            - "release/**"
jobs:
    test:
        runs_on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v6.0.2
          
        - name: Run tests
          run: npm test